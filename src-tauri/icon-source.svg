<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="front" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dbe7ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#0a1f66" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect x="48" y="48" width="928" height="928" rx="210" fill="url(#bg)"/>
  <!-- the deck: two cards peeking out behind the front one -->
  <rect x="196" y="236" width="632" height="400" rx="56" fill="#ffffff" fill-opacity="0.28" transform="rotate(-7 512 436)"/>
  <rect x="196" y="236" width="632" height="400" rx="56" fill="#ffffff" fill-opacity="0.5" transform="rotate(-3.5 512 436)" filter="url(#shadow)"/>
  <rect x="196" y="236" width="632" height="400" rx="56" fill="url(#front)" transform="translate(0 70)" filter="url(#shadow)"/>
  <!-- play button -->
  <path d="M462 392 L462 616 Q462 640 483 628 L664 520 Q684 508 664 496 L483 388 Q462 376 462 392 Z" fill="#2563eb" transform="translate(0 0)"/>
